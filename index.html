<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resto Lights MTL — Mobile Headlight Restoration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Rajdhani', 'sans-serif'],
          },
          colors: {
            void: '#05070a',
            surface: '#0b0f17',
            surface2: '#111827',
            xenon: '#38bdf8',
            xenonBright: '#7dd3fc',
            xenonDeep: '#0284c7',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #05070a;
      color: #f1f5f9;
      background-image:
        radial-gradient(circle at 50% -10%, rgba(56, 189, 248, 0.16), transparent 55%),
        radial-gradient(circle at 85% 25%, rgba(14, 165, 233, 0.09), transparent 45%);
    }
    .glass-card {
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.92) 0%, rgba(10, 15, 24, 0.96) 100%);
      border: 1px solid rgba(148, 163, 184, 0.16);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }
    .xenon-glow {
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
    }
    .logo-text-chrome {
      background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 42%, #7dd3fc 72%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-logo-frame {
      background: #000000;
      border: 1px solid rgba(125, 211, 252, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85), 0 0 24px rgba(56, 189, 248, 0.16);
    }
    select, input[type="text"], input[type="tel"], input[type="email"] {
      color-scheme: dark;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-sky-500/30 selection:text-sky-200">

  <!-- Top Bar -->
  <header class="border-b border-slate-800/80 bg-black/85 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
      <a href="#" class="flex items-center gap-3">
        <div class="brand-logo-frame rounded-lg overflow-hidden h-12 sm:h-14 flex items-center justify-center px-2">
          <img
            src="logo.jpg"
            alt="Resto Lights MTL Logo"
            class="h-9 sm:h-11 w-auto object-contain select-none"
            onerror="this.style.display='none'; document.getElementById('hdr-logo-svg').classList.remove('hidden');"
          />
          <svg id="hdr-logo-svg" viewBox="0 0 220 48" class="hidden h-8 w-auto select-none" role="img" aria-label="Resto Lights MTL Logo">
            <defs>
              <linearGradient id="rlmHdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="50%" stop-color="#cbd5e1" />
                <stop offset="100%" stop-color="#38bdf8" />
              </linearGradient>
            </defs>
            <ellipse cx="22" cy="24" rx="15" ry="10" fill="none" stroke="#38bdf8" stroke-width="2" />
            <circle cx="24" cy="24" r="5" fill="#7dd3fc" />
            <text x="46" y="29" fill="url(#rlmHdrGrad)" font-family="Rajdhani, sans-serif" font-weight="700" font-style="italic" font-size="22" letter-spacing="1.5">RESTO LIGHTS MTL</text>
          </svg>
        </div>
      </a>

      <div class="flex items-center gap-2 sm:gap-3">
        <div class="inline-flex rounded-lg bg-slate-900 p-1 border border-slate-800">
          <button type="button" id="btn-en" onclick="setLang('en')" class="px-2.5 py-1 rounded-md text-xs font-bold bg-sky-500 text-slate-950 transition cursor-pointer">EN</button>
          <button type="button" id="btn-fr" onclick="setLang('fr')" class="px-2.5 py-1 rounded-md text-xs font-bold text-slate-300 hover:text-white transition cursor-pointer">FR</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="max-w-6xl mx-auto px-4 pt-7 pb-6 text-center">
    <div class="max-w-sm mx-auto mb-5">
      <div class="brand-logo-frame rounded-2xl overflow-hidden bg-black p-3">
        <img
          src="logo.jpg"
          alt="Resto Lights MTL Logo"
          class="w-full h-auto max-h-44 object-contain mx-auto rounded-xl select-none"
          onerror="this.style.display='none'; document.getElementById('hero-logo-svg').classList.remove('hidden');"
        />
        <svg id="hero-logo-svg" viewBox="0 0 360 110" class="hidden w-full h-28 mx-auto select-none" role="img" aria-label="Resto Lights MTL Emblem">
          <defs>
            <linearGradient id="rlmHeroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="45%" stop-color="#e2e8f0" />
              <stop offset="100%" stop-color="#38bdf8" />
            </linearGradient>
          </defs>
          <ellipse cx="62" cy="55" rx="36" ry="24" fill="none" stroke="#38bdf8" stroke-width="2.5" />
          <ellipse cx="62" cy="55" rx="22" ry="14" fill="rgba(56,189,248,0.15)" stroke="#7dd3fc" stroke-width="1.5" />
          <circle cx="66" cy="55" r="8" fill="#7dd3fc" />
          <text x="112" y="52" fill="url(#rlmHeroGrad)" font-family="Rajdhani, sans-serif" font-weight="700" font-style="italic" font-size="30" letter-spacing="1.5">RESTO LIGHTS</text>
          <text x="112" y="80" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="15" letter-spacing="4">MONTREAL MOBILE</text>
        </svg>
      </div>
    </div>

    <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-sky-500/10 border border-sky-400/30 text-sky-300 text-xs font-semibold tracking-wide mb-4">
      <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
      <span id="hero-badge">100% MOBILE SERVICE • 2-YR CERAMIC COATING INCLUDED</span>
    </div>

    <h1 class="font-display text-4xl sm:text-6xl font-bold tracking-tight uppercase leading-none mb-3">
      <span id="hero-title-1" class="text-white">Crystal Clear Beams.</span>
      <span id="hero-title-2" class="logo-text-chrome block sm:inline"> Instant Mobile Quote.</span>
    </h1>

    <p id="hero-subtitle" class="max-w-2xl mx-auto text-slate-300 text-sm sm:text-base leading-relaxed">
      We come directly to your home, office, or any convenient parking lot across Greater Montreal. Every restoration includes a 2-year ceramic coating warranty.
    </p>
  </section>

  <!-- Main Estimator Grid -->
  <main class="max-w-6xl mx-auto px-4 pb-16 grid grid-cols-1 lg:grid-cols-12 gap-7 items-start">

    <!-- Left 7 Columns -->
    <div class="lg:col-span-7 space-y-6">

      <!-- Step 1: Vehicle Information -->
      <div class="glass-card rounded-2xl p-5 sm:p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-display text-xl sm:text-2xl font-bold uppercase tracking-wide text-white flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-lg bg-sky-500/20 border border-sky-400/40 text-sky-300 text-sm flex items-center justify-center font-bold">1</span>
            <span id="step1-title">Vehicle Information</span>
          </h2>
          <span class="text-xs text-sky-300/90 font-medium">Year • Make • Model</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label for="car-year" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Year</label>
            <select id="car-year" onchange="updateQuotePreview()" class="w-full rounded-xl bg-slate-950/90 border border-slate-700/80 focus:border-sky-400 px-3.5 py-2.5 text-sm text-white outline-none transition"></select>
          </div>

          <div>
            <label for="car-make" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Make</label>
            <select id="car-make" onchange="handleMakeChange()" class="w-full rounded-xl bg-slate-950/90 border border-slate-700/80 focus:border-sky-400 px-3.5 py-2.5 text-sm text-white outline-none transition"></select>
          </div>

          <div>
            <label for="car-model" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Model</label>
            <select id="car-model" onchange="updateQuotePreview()" class="w-full rounded-xl bg-slate-950/90 border border-slate-700/80 focus:border-sky-400 px-3.5 py-2.5 text-sm text-white outline-none transition"></select>
          </div>
        </div>

        <div id="custom-model-wrap" class="hidden mt-3">
          <input id="custom-model-input" type="text" value="" oninput="updateQuotePreview()" class="w-full rounded-xl bg-slate-950/90 border border-slate-700/80 focus:border-sky-400 px-3.5 py-2.5 text-sm text-white outline-none transition" />
        </div>

        <!-- Vehicle Class -->
        <div class="mt-4 pt-4 border-t border-slate-800/80">
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Vehicle Class</label>
          <div class="grid grid-cols-3 gap-2.5">
            <button type="button" data-size="standard" onclick="selectSize('standard')" id="size-standard" class="size-btn py-2.5 px-3 rounded-xl border border-sky-400 bg-sky-500/15 text-sky-200 text-xs sm:text-sm font-semibold transition text-center cursor-pointer">
              <span>Sedan / Coupe</span>
              <span class="block text-[11px] text-sky-300/80 font-normal">Standard Class</span>
            </button>
            <button type="button" data-size="suv" onclick
